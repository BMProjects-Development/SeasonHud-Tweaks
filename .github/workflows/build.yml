name: Build and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate version and release notes
        id: version
        run: python .github/scripts/release.py check

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and check every port
        run: bash ./gradlew --no-daemon build verifyPorts releaseBundle releaseSources --console=plain

      - name: Validate release files
        run: python .github/scripts/release.py verify

      - uses: actions/upload-artifact@v7
        with:
          name: seasonhudtweaks-${{ steps.version.outputs.version }}
          path: build/release/*
          if-no-files-found: error

  release:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: seasonhudtweaks-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: seasonhudtweaks-${{ needs.build.outputs.version }}
          path: release

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Publish to GitHub and CurseForge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: python .github/scripts/release.py publish

      - name: Publish to Modrinth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python .github/scripts/release.py publish-modrinth
