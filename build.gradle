import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

plugins {
    id 'java'
}

group = 'org.bmp'
version = mod_version

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.minecraftforge.net/'
        content {
            includeGroup 'net.minecraftforge'
            includeGroup 'org.spongepowered'
        }
    }
    maven {
        url = 'https://maven.neoforged.net/releases/'
        content { includeGroup 'net.neoforged.fancymodloader' }
    }
    maven {
        url = 'https://libraries.minecraft.net/'
        content { includeGroup 'net.minecraft' }
    }
}

sourceSets {
    forge
    forgeClassic
    forgeArchive
    neoforge
}

dependencies {
    compileOnly('org.spongepowered:mixin:0.8.5') { transitive = false }
    forgeCompileOnly('net.minecraftforge:forge:1.16.5-36.2.42:universal') { transitive = false }
    forgeClassicCompileOnly('net.minecraftforge:forge:1.16.5-36.2.42:universal') { transitive = false }
    forgeClassicCompileOnly 'org.apache.commons:commons-lang3:3.9'
    forgeArchiveCompileOnly('net.minecraftforge:forge:1.17.1-37.1.1:universal') { transitive = false }
    forgeArchiveCompileOnly('net.minecraftforge:fmlloader:1.17.1-37.1.1') { transitive = false }
    forgeArchiveCompileOnly('net.minecraftforge:javafmllanguage:1.17.1-37.1.1') { transitive = false }
    forgeArchiveCompileOnly('net.minecraftforge:eventbus:5.0.3') { transitive = false }
    forgeArchiveCompileOnly('net.minecraftforge:mergetool:1.1.7:api') { transitive = false }
    neoforgeCompileOnly('net.neoforged.fancymodloader:loader:2.0.17') { transitive = false }
    testImplementation('org.spongepowered:mixin:0.8.7') { transitive = false }
    testImplementation('net.minecraft:launchwrapper:1.12') { transitive = false }
    testImplementation 'org.ow2.asm:asm-tree:9.9.1'
    testRuntimeOnly 'org.ow2.asm:asm-analysis:9.9.1'
    testRuntimeOnly 'org.ow2.asm:asm-commons:9.9.1'
    testRuntimeOnly 'org.ow2.asm:asm-util:9.9.1'
    testRuntimeOnly 'com.google.guava:guava:33.5.0-jre'
    testRuntimeOnly 'com.google.code.gson:gson:2.13.2'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.25.3'
    testRuntimeOnly 'net.sf.jopt-simple:jopt-simple:5.0.4'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
    // All injection targets are unmapped SeasonHud members.
    options.compilerArgs.add('-proc:none')
}

tasks.named('compileNeoforgeJava', JavaCompile) {
    options.release = 17
}

tasks.named('compileForgeArchiveJava', JavaCompile) {
    options.release = 16
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def ports = new JsonSlurper().parse(file('ports.json'))
def requestedPort = providers.gradleProperty('port').orNull
if (requestedPort != null && !ports.any { it.id == requestedPort }) {
    throw new GradleException("Unknown port: ${requestedPort}")
}
def selectedPorts = ports.findAll { requestedPort == null || it.id == requestedPort }

def upstreamTasks = [:]
def downloadUpstream = { upstream ->
    upstreamTasks.computeIfAbsent(upstream.url) {
        def filename = upstream.url.tokenize('/').last()
        def cachedJar = layout.buildDirectory.file("upstream/${filename}")
        tasks.register("download-${filename}") {
            inputs.properties(upstream)
            outputs.file(cachedJar)
            doLast {
                def jar = cachedJar.get().asFile
                jar.parentFile.mkdirs()
                def connection = URI.create(upstream.url).toURL().openConnection()
                connection.connectTimeout = 20000
                connection.readTimeout = 30000
                connection.setRequestProperty('User-Agent', 'BMProjects/SeasonHud-Tweaks')
                byte[] bytes = connection.inputStream.withCloseable { it.bytes }
                def digest = MessageDigest.getInstance('SHA-512').digest(bytes).encodeHex()
                if (digest.toString() != upstream.sha512) {
                    throw new GradleException("Unexpected checksum for ${filename}")
                }
                jar.bytes = bytes
            }
        }
    }
}

def archive = ports.find { it.overlayEvent }
dependencies {
    forgeArchiveCompileOnly files(downloadUpstream(archive.upstream))
}

def metadataDir = layout.projectDirectory.dir('src/metadata')
def releaseDir = layout.buildDirectory.dir('release')
def modName = 'SeasonHud Tweaks'
def description = 'Require a calendar for the SeasonHud overlay.'
def modId = 'seasonhudtweaks'
def mixinConfig = "${modId}.mixins.json"
def portJars = selectedPorts.collect { port ->
    tasks.register("jar-${port.id}", Jar) {
        archiveFileName = "${modId}-${port.id}-${version}.jar"
        destinationDirectory = releaseDir

        if (port.overlayEvent) {
            from(sourceSets.forgeArchive.output)
        } else {
            def mixins = [port.mixin]
            if (port.classic) {
                mixins.add('ClassicCalendarMixin')
                from(metadataDir.file('pack.mcmeta'))
            }
            from(sourceSets.main.output) {
                include mixins.collect { "org/bmp/seasonhudtweaks/mixin/${it}.class" }
            }
            from(metadataDir.file(mixinConfig)) {
                expand(mixins: JsonOutput.toJson(mixins))
            }
            inputs.property('mixins', mixins)
        }

        def values = [
            id: modId,
            name: modName,
            version: version.toString(),
            description: description,
            mixinConfig: mixinConfig,
            java: port.java,
            seasonHud: port.seasonHud,
            seasonHudLimit: port.seasonHudLimit ?: (port.mixin == 'LegacyCalendarMixin' ? '1.10' : '2.1'),
            loaderVersion: port.loaderVersion
        ]
        if (port.loader == 'fabric') {
            values.minecraft = JsonOutput.toJson(port.minecraft.collect { "=${it}" })
            from(metadataDir.file('fabric.mod.json')) { expand(values) }
        } else {
            boolean forge = port.modLoader.startsWith('forge')
            values.loader = forge ? 'forge' : 'neoforge'
            values.loaderRange = port.loaderRange
            values.minecraft = port.minecraftRange
            values.requirement = forge ? 'mandatory = true' : 'type = "required"'
            if (port.metadata == 'META-INF/mods.toml') {
                // NeoForge 1.20.4 and 1.20.6 still use the older TOML syntax.
                values.requirement = 'mandatory = true'
            }
            values.mixinRegistration = forge ? '' : "[[mixins]]\nconfig = \"${mixinConfig}\""
            if (forge && !port.overlayEvent) {
                manifest.attributes('MixinConfigs': mixinConfig)
            }
            from(sourceSets[port.modLoader].output)
            from(metadataDir.file('mods.toml')) {
                into 'META-INF'
                rename { port.metadata.substring('META-INF/'.length()) }
                expand(values)
            }
        }
        inputs.properties(values)
    }
}

def verifyPorts = tasks.register('verifyPorts')
selectedPorts.each { port ->
    def candidates = [(port.overlayEvent ? 'overlay' : port.mixin): port.upstream]
    if (port.classic) {
        candidates.ClassicCalendarMixin = port.classic
    }
    candidates.each { mixin, upstream ->
        def downloadTask = downloadUpstream(upstream)
        def portJar = tasks.named("jar-${port.id}", Jar)
        def verification = tasks.register("verify-${port.id}-${mixin}", JavaExec) {
            dependsOn(downloadTask, portJar, tasks.named('testClasses'))
            classpath = sourceSets.test.runtimeClasspath
            mainClass = 'org.bmp.seasonhudtweaks.CalendarMixinCheck'
            doFirst {
                args(portJar.get().archiveFile.get().asFile, downloadTask.get().outputs.files.singleFile, mixin)
            }
        }
        verifyPorts.configure { dependsOn(verification) }
    }
}

tasks.named('jar') { enabled = false }

tasks.register('releaseArtifacts') {
    dependsOn(portJars)
}

tasks.named('assemble') {
    dependsOn('releaseArtifacts')
}

tasks.register('releaseBundle', Zip) {
    dependsOn(portJars)
    archiveFileName = "${modId}-${version}.zip"
    destinationDirectory = releaseDir
    into('mods') {
        from(portJars)
    }
    into('docs') {
        from('docs')
    }
    into('changelogs') {
        from('changelogs')
    }
    from('README.md', 'ports.json')
}

tasks.register('releaseSources', Jar) {
    archiveFileName = "${modId}-${version}-sources.jar"
    destinationDirectory = releaseDir
    from(sourceSets.main.allSource)
    for (def loader : ['forge', 'forgeClassic', 'forgeArchive', 'neoforge']) {
        into(loader) { from(sourceSets[loader].allSource) }
    }
    into('metadata') { from(metadataDir) }
    from('ports.json')
}
