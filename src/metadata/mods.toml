description = "${description}"
displayTest = "IGNORE_ALL_VERSION"

${mixinRegistration}

[[dependencies.${id}]]
modId = "${loader}"
${requirement}
versionRange = "${loaderRange}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
${requirement}
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "seasonhud"
${requirement}
versionRange = "[${seasonHud},${seasonHudLimit})"
ordering = "AFTER"
side = "CLIENT"