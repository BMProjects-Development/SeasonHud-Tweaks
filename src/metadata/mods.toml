issueTrackerURL = "https://github.com/BMProjects-Development/SeasonHud-Tweaks/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/seasonhud-tweaks"
